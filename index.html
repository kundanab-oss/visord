<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battlegrounds: Elite Zone 🪖</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: #050811;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #0b0f19;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Top Left Status HUD */
    .hud-left {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 8px;
      min-width: 220px;
    }

    .stat-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .operator-tag {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .bar-bg {
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 5px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      transition: width 0.2s ease;
    }

    .hp-fill { background: #22c55e; }
    .armor-fill { background: #38bdf8; }

    /* Top Right Minimap & Alive Tracker */
    .hud-right {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    .match-stats {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 8px;
      display: flex;
      gap: 20px;
      font-weight: bold;
      font-size: 14px;
    }

    .alive-txt { color: #facc15; }
    .kills-txt { color: #ef4444; }

    #minimap {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      background: rgba(5, 8, 17, 0.9);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
    }

    /* Bottom Weapon Status */
    .hud-weapon {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      backdrop-filter: blur(8px);
      padding: 12px 20px;
      border-radius: 10px;
      text-align: right;
    }

    .weapon-name {
      font-size: 18px;
      font-weight: bold;
      color: #38bdf8;
    }

    .ammo-txt {
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
    }

    /* Overlay Screen (Form & Menus) */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 8, 17, 0.92);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      z-index: 20;
      padding: 20px;
    }

    .overlay h1 {
      font-size: 38px;
      color: #38bdf8;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }

    .overlay p {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* Registration Form Box */
    .form-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 25px 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: left;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 10px 12px;
      background: #050811;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: #38bdf8;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 25px rgba(56, 189, 248, 0.6);
    }

    /* Killfeed Notifications */
    .killfeed {
      position: absolute;
      top: 120px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: none;
    }

    .feed-item {
      font-size: 12px;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.7);
      padding: 4px 10px;
      border-radius: 4px;
      color: #cbd5e1;
      border-left: 3px solid #ef4444;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <!-- Main Battle Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Top Left Player Gauges -->
    <div class="hud-left">
      <div class="stat-card">
        <div id="operatorTag" class="operator-tag">OPERATOR: AGENT</div>
        <div class="stat-label">Health</div>
        <div class="bar-bg"><div id="hpBar" class="bar-fill hp-fill" style="width: 100%;"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Armor</div>
        <div class="bar-bg"><div id="armorBar" class="bar-fill armor-fill" style="width: 0%;"></div></div>
      </div>
    </div>

    <!-- Kill Feed -->
    <div class="killfeed" id="killFeed"></div>

    <!-- Top Right Minimap & Tracker -->
    <div class="hud-right">
      <div class="match-stats">
        <div>ALIVE: <span id="aliveTxt" class="alive-txt">20</span></div>
        <div>KILLS: <span id="killsTxt" class="kills-txt">0</span></div>
      </div>
      <canvas id="minimap" width="150" height="150"></canvas>
    </div>

    <!-- Bottom Right Weapon HUD -->
    <div class="hud-weapon">
      <div id="weaponName" class="weapon-name">Pistol</div>
      <div id="ammoTxt" class="ammo-txt">12 / ∞</div>
    </div>

    <!-- Overlay Screen with Registration Form -->
    <div class="overlay" id="menuOverlay">
      <h1 id="menuTitle">Battlegrounds: Elite Zone 🪖</h1>
      <p id="menuSub">Enter your deployment clearance details below to join the match.</p>

      <form id="operatorForm" class="form-card" onsubmit="handleRegistration(event)">
        <div class="input-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="e.g. Aarav Kumar" required>
        </div>

        <div class="input-group">
          <label for="callsign">In-Game Call-sign / Tag</label>
          <input type="text" id="callsign" placeholder="e.g. Ghost_007" required>
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="e.g. operator@zone.com" required>
        </div>

        <div class="input-group">
          <label for="classType">Tactical Class</label>
          <select id="classType" required>
            <option value="Assault">Assault (+10% Movement Speed)</option>
            <option value="Juggernaut">Juggernaut (+50 Initial Armor)</option>
            <option value="Sniper">Sniper (Spawns with Sniper Rifle)</option>
          </select>
        </div>

        <button type="submit" class="btn">ENTER BATTLEGROUND 🚀</button>
      </form>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap');
    const miniCtx = minimapCanvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const MAP_SIZE = 3000;
    let safeZone = { x: MAP_SIZE / 2, y: MAP_SIZE / 2, radius: 1400 };

    const WEAPONS = {
      Pistol: { name: 'Pistol', damage: 20, fireRate: 300, speed: 12, spread: 0.05, maxAmmo: 12 },
      AR: { name: 'Assault Rifle', damage: 28, fireRate: 120, speed: 16, spread: 0.08, maxAmmo: 30 },
      Shotgun: { name: 'Shotgun', damage: 15, fireRate: 800, speed: 10, spread: 0.25, pellets: 6, maxAmmo: 8 },
      Sniper: { name: 'Sniper Rifle', damage: 85, fireRate: 1200, speed: 25, spread: 0.01, maxAmmo: 5 }
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playAudio(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    let gameActive = false;
    let operatorData = { name: '', callsign: 'Agent', email: '', classType: 'Assault' };
    let player;
    let bots = [];
    let bullets = [];
    let lootItems = [];
    let mousePos = { x: 0, y: 0 };
    let keys = {};

    window.addEventListener('keydown', e => {
      keys[e.key.toLowerCase()] = true;
      if (['1', '2', '3', '4'].includes(e.key) && player) {
        const weaponKeys = Object.keys(WEAPONS);
        const idx = parseInt(e.key) - 1;
        if (player.inventory.includes(weaponKeys[idx])) {
          player.currentWeapon = WEAPONS[weaponKeys[idx]];
          updateWeaponHUD();
        }
      }
    });

    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => {
      mousePos.x = e.clientX;
      mousePos.y = e.clientY;
    });

    window.addEventListener('mousedown', e => {
      if (e.button === 0) shootWeapon(player);
    });

    function handleRegistration(e) {
      e.preventDefault();
      operatorData.name = document.getElementById('fullName').value;
      operatorData.callsign = document.getElementById('callsign').value.toUpperCase();
      operatorData.email = document.getElementById('email').value;
      operatorData.classType = document.getElementById('classType').value;

      document.getElementById('operatorTag').innerText = `OPERATOR: ${operatorData.callsign}`;
      startGame();
    }

    function startGame() {
      gameActive = true;
      document.getElementById('menuOverlay').style.display = 'none';

      safeZone = { x: MAP_SIZE / 2, y: MAP_SIZE / 2, radius: 1400 };

      // Apply Class Bonuses
      let startSpeed = operatorData.classType === 'Assault' ? 4.5 : 4.0;
      let startArmor = operatorData.classType === 'Juggernaut' ? 50 : 0;
      let startWeapon = operatorData.classType === 'Sniper' ? WEAPONS.Sniper : WEAPONS.Pistol;

      player = {
        x: MAP_SIZE / 2 + (Math.random() - 0.5) * 500,
        y: MAP_SIZE / 2 + (Math.random() - 0.5) * 500,
        radius: 18,
        hp: 100,
        maxHp: 100,
        armor: startArmor,
        maxArmor: 100,
        speed: startSpeed,
        angle: 0,
        kills: 0,
        currentWeapon: startWeapon,
        inventory: ['Pistol', 'AR', 'Shotgun', 'Sniper']
      };

      bots = [];
      for (let i = 0; i < 19; i++) {
        bots.push({
          id: i + 1,
          x: Math.random() * (MAP_SIZE - 200) + 100,
          y: Math.random() * (MAP_SIZE - 200) + 100,
          radius: 18,
          hp: 100,
          armor: 25,
          speed: 3,
          angle: Math.random() * Math.PI * 2,
          currentWeapon: WEAPONS[Object.keys(WEAPONS)[Math.floor(Math.random() * 4)]],
          lastShot: 0
        });
      }

      lootItems = [];
      const types = ['Medkit', 'Armor', 'AR', 'Shotgun', 'Sniper'];
      for (let i = 0; i < 80; i++) {
        lootItems.push({
          x: Math.random() * (MAP_SIZE - 200) + 100,
          y: Math.random() * (MAP_SIZE - 200) + 100,
          type: types[Math.floor(Math.random() * types.length)]
        });
      }

      bullets = [];
      updateHUD();
      requestAnimationFrame(gameLoop);
    }

    function shootWeapon(character) {
      if (!gameActive) return;
      const now = Date.now();
      const w = character.currentWeapon;

      if (now - (character.lastShot || 0) < w.fireRate) return;
      character.lastShot = now;

      playAudio(w.name === 'Sniper' ? 120 : 300, 'sawtooth', 0.1);

      const pellets = w.pellets || 1;
      for (let i = 0; i < pellets; i++) {
        const spreadAngle = character.angle + (Math.random() - 0.5) * w.spread;
        bullets.push({
          x: character.x + Math.cos(character.angle) * character.radius,
          y: character.y + Math.sin(character.angle) * character.radius,
          vx: Math.cos(spreadAngle) * w.speed,
          vy: Math.sin(spreadAngle) * w.speed,
          damage: w.damage,
          owner: character,
          range: 800
        });
      }
    }

    function gameLoop() {
      if (!gameActive) return;

      if (safeZone.radius > 200) safeZone.radius -= 0.15;

      let moveX = 0, moveY = 0;
      if (keys['w'] || keys['arrowup']) moveY -= 1;
      if (keys['s'] || keys['arrowdown']) moveY += 1;
      if (keys['a'] || keys['arrowleft']) moveX -= 1;
      if (keys['d'] || keys['arrowright']) moveX += 1;

      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        player.x = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.x + (moveX / len) * player.speed));
        player.y = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, player.y + (moveY / len) * player.speed));
      }

      const screenCenterX = canvas.width / 2;
      const screenCenterY = canvas.height / 2;
      player.angle = Math.atan2(mousePos.y - screenCenterY, mousePos.x - screenCenterX);

      const distToZoneCenter = Math.hypot(player.x - safeZone.x, player.y - safeZone.y);
      if (distToZoneCenter > safeZone.radius) {
        player.hp -= 0.1;
        if (player.hp <= 0) endGame('You died in the Blue Zone! 🌀');
      }

      bots.forEach((bot, bIdx) => {
        const botZoneDist = Math.hypot(bot.x - safeZone.x, bot.y - safeZone.y);
        if (botZoneDist > safeZone.radius) {
          bot.angle = Math.atan2(safeZone.y - bot.y, safeZone.x - bot.x);
        } else if (Math.random() < 0.02) {
          bot.angle += (Math.random() - 0.5);
        }

        bot.x = Math.max(bot.radius, Math.min(MAP_SIZE - bot.radius, bot.x + Math.cos(bot.angle) * bot.speed));
        bot.y = Math.max(bot.radius, Math.min(MAP_SIZE - bot.radius, bot.y + Math.sin(bot.angle) * bot.speed));

        const distToPlayer = Math.hypot(player.x - bot.x, player.y - bot.y);
        if (distToPlayer < 400) {
          bot.angle = Math.atan2(player.y - bot.y, player.x - bot.x);
          shootWeapon(bot);
        }

        if (botZoneDist > safeZone.radius) {
          bot.hp -= 0.2;
          if (bot.hp <= 0) bots.splice(bIdx, 1);
        }
      });

      bullets.forEach((b, bIdx) => {
        b.x += b.vx;
        b.y += b.vy;
        b.range -= Math.hypot(b.vx, b.vy);

        if (b.owner !== player) {
          if (Math.hypot(player.x - b.x, player.y - b.y) < player.radius) {
            let dmg = b.damage;
            if (player.armor > 0) {
              player.armor = Math.max(0, player.armor - dmg * 0.5);
              dmg *= 0.5;
            }
            player.hp -= dmg;
            playAudio(100, 'square', 0.2);
            bullets.splice(bIdx, 1);
            if (player.hp <= 0) endGame('You were eliminated! 💥');
            return;
          }
        }

        bots.forEach((bot, botIdx) => {
          if (b.owner !== bot && Math.hypot(bot.x - b.x, bot.y - b.y) < bot.radius) {
            bot.hp -= b.damage;
            bullets.splice(bIdx, 1);

            if (bot.hp <= 0) {
              bots.splice(botIdx, 1);
              if (b.owner === player) {
                player.kills++;
                addKillfeed(`${operatorData.callsign} eliminated Bot#${bot.id}`);
              }
            }
          }
        });

        if (b.range <= 0 || b.x < 0 || b.x > MAP_SIZE || b.y < 0 || b.y > MAP_SIZE) {
          bullets.splice(bIdx, 1);
        }
      });

      lootItems.forEach((item, lIdx) => {
        if (Math.hypot(player.x - item.x, player.y - item.y) < player.radius + 15) {
          if (item.type === 'Medkit' && player.hp < player.maxHp) {
            player.hp = Math.min(player.maxHp, player.hp + 40);
            playAudio(600, 'sine', 0.2);
            lootItems.splice(lIdx, 1);
          } else if (item.type === 'Armor' && player.armor < player.maxArmor) {
            player.armor = Math.min(player.maxArmor, player.armor + 50);
            playAudio(500, 'sine', 0.2);
            lootItems.splice(lIdx, 1);
          }
        }
      });

      if (bots.length === 0) endGame('VICTORY ROYALE! 🏆');

      renderScene();
      updateHUD();

      if (gameActive) requestAnimationFrame(gameLoop);
    }

    function renderScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const camX = canvas.width / 2 - player.x;
      const camY = canvas.height / 2 - player.y;

      ctx.save();
      ctx.translate(camX, camY);

      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let x = 0; x < MAP_SIZE; x += 100) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_SIZE); ctx.stroke();
      }
      for (let y = 0; y < MAP_SIZE; y += 100) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_SIZE, y); ctx.stroke();
      }

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(safeZone.x, safeZone.y, safeZone.radius, 0, Math.PI * 2);
      ctx.stroke();

      lootItems.forEach(item => {
        ctx.fillStyle = item.type === 'Medkit' ? '#22c55e' : item.type === 'Armor' ? '#38bdf8' : '#facc15';
        ctx.beginPath();
        ctx.arc(item.x, item.y, 8, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = '#facc15';
      bullets.forEach(b => {
        ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
      });

      bots.forEach(bot => {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(bot.x, bot.y, bot.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(player.x + Math.cos(player.angle) * 30, player.y + Math.sin(player.angle) * 30);
      ctx.stroke();

      ctx.restore();
      renderMinimap();
    }

    function renderMinimap() {
      miniCtx.clearRect(0, 0, 150, 150);
      const scale = 150 / MAP_SIZE;

      miniCtx.strokeStyle = '#38bdf8';
      miniCtx.lineWidth = 2;
      miniCtx.beginPath();
      miniCtx.arc(safeZone.x * scale, safeZone.y * scale, safeZone.radius * scale, 0, Math.PI * 2);
      miniCtx.stroke();

      miniCtx.fillStyle = '#ef4444';
      bots.forEach(bot => {
        miniCtx.fillRect(bot.x * scale - 2, bot.y * scale - 2, 4, 4);
      });

      miniCtx.fillStyle = '#22c55e';
      miniCtx.beginPath();
      miniCtx.arc(player.x * scale, player.y * scale, 4, 0, Math.PI * 2);
      miniCtx.fill();
    }

    function updateHUD() {
      document.getElementById('hpBar').style.width = Math.max(0, player.hp) + '%';
      document.getElementById('armorBar').style.width = Math.max(0, player.armor) + '%';
      document.getElementById('aliveTxt').innerText = bots.length + 1;
      document.getElementById('killsTxt').innerText = player.kills;
      updateWeaponHUD();
    }

    function updateWeaponHUD() {
      document.getElementById('weaponName').innerText = player.currentWeapon.name;
      document.getElementById('ammoTxt').innerText = player.currentWeapon.maxAmmo + ' / ∞';
    }

    function addKillfeed(msg) {
      const feed = document.getElementById('killFeed');
      const item = document.createElement('div');
      item.className = 'feed-item';
      item.innerText = msg;
      feed.appendChild(item);
      setTimeout(() => item.remove(), 4000);
    }

    function endGame(title) {
      gameActive = false;
      document.getElementById('menuTitle').innerText = title;
      document.getElementById('menuSub').innerHTML = `Operator: <b>${operatorData.callsign}</b><br>Eliminations: <b>${player.kills}</b> | Rank: <b>#${bots.length + 1}</b>`;
      document.getElementById('operatorForm').style.display = 'none';
      document.getElementById('menuOverlay').style.display = 'flex';
    }
  </script>
</body>
</html>
